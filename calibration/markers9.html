<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Touch Calibration 9</title>
<style>
  html, body { margin:0; padding:0; width:1920px; height:1200px; overflow:hidden;
               background:#0a0a12; cursor:none; }
  .cross { position:absolute; background:#28d060; }
  .h-line { height:3px; }
  .v-line { width:3px; }
  .dot { position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px;
         border-radius:50%; background:#ff3344; }
  .lbl { position:absolute; font:bold 56px monospace; color:#28d060; }
</style>
</head>
<body>
  <!-- targets: 1(120,600) 2(540,600) 3(960,600) 4(1380,600) 5(1800,600)
                6(960,120) 7(960,360) 8(960,840) 9(960,1080) -->

  <div class="cross h-line" style="left:0;     top:598px;  width:260px;"></div>
  <div class="cross v-line" style="left:118px; top:470px;  height:260px;"></div>
  <div class="dot" style="left:120px; top:600px;"></div>
  <div class="lbl" style="left:150px; top:640px;">1</div>

  <div class="cross h-line" style="left:410px; top:598px;  width:260px;"></div>
  <div class="cross v-line" style="left:538px; top:470px;  height:260px;"></div>
  <div class="dot" style="left:540px; top:600px;"></div>
  <div class="lbl" style="left:570px; top:640px;">2</div>

  <div class="cross h-line" style="left:830px; top:598px;  width:260px;"></div>
  <div class="cross v-line" style="left:958px; top:470px;  height:260px;"></div>
  <div class="dot" style="left:960px; top:600px;"></div>
  <div class="lbl" style="left:990px; top:640px;">3</div>

  <div class="cross h-line" style="left:1250px; top:598px; width:260px;"></div>
  <div class="cross v-line" style="left:1378px; top:470px; height:260px;"></div>
  <div class="dot" style="left:1380px; top:600px;"></div>
  <div class="lbl" style="left:1410px; top:640px;">4</div>

  <div class="cross h-line" style="left:1670px; top:598px; width:250px;"></div>
  <div class="cross v-line" style="left:1798px; top:470px; height:260px;"></div>
  <div class="dot" style="left:1800px; top:600px;"></div>
  <div class="lbl" style="left:1670px; top:640px;">5</div>

  <div class="cross h-line" style="left:830px; top:118px;  width:260px;"></div>
  <div class="cross v-line" style="left:958px; top:0;     height:240px;"></div>
  <div class="dot" style="left:960px; top:120px;"></div>
  <div class="lbl" style="left:1000px; top:110px;">6</div>

  <div class="cross h-line" style="left:830px; top:358px;  width:260px;"></div>
  <div class="cross v-line" style="left:958px; top:240px;  height:240px;"></div>
  <div class="dot" style="left:960px; top:360px;"></div>
  <div class="lbl" style="left:1000px; top:350px;">7</div>

  <div class="cross h-line" style="left:830px; top:838px;  width:260px;"></div>
  <div class="cross v-line" style="left:958px; top:720px;  height:240px;"></div>
  <div class="dot" style="left:960px; top:840px;"></div>
  <div class="lbl" style="left:1000px; top:830px;">8</div>

  <div class="cross h-line" style="left:830px; top:1078px; width:260px;"></div>
  <div class="cross v-line" style="left:958px; top:960px;  height:240px;"></div>
  <div class="dot" style="left:960px; top:1080px;"></div>
  <div class="lbl" style="left:1000px; top:1010px;">9</div>
</body>
</html>
